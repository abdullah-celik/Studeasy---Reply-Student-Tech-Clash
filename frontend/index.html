<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studeasy</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("studeasy:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/maskable-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Your notes, turned into a study buddy: an AI tutor, quizzes, flashcards, study reels and plans built from your own course material." />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1922" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studeasy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
