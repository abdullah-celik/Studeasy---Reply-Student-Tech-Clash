# Render Blueprint: New + > Blueprint > connect this repo > Apply.
# Values marked sync: false are entered in the Render dashboard on first apply.
services:
  - type: web
    name: studeasy-api
    runtime: docker
    plan: free
    region: frankfurt # next to the Supabase project (eu-central-1)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Cloudflare Workers AI: free daily allowance (dash.cloudflare.com -> AI -> Workers AI)
      - key: LLM_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        value: https://vglxdxdrtyicmgcmubqm.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # JSON list: your Cloudflare Pages URL + local dev
      - key: CORS_ORIGINS
        sync: false
      # Also allow Cloudflare Pages preview deployments (<hash>.<project>.pages.dev)
      - key: CORS_ORIGIN_REGEX
        value: https://([a-z0-9-]+\.)?studeasy\.pages\.dev
      - key: ENABLE_REELS
        value: "true"
